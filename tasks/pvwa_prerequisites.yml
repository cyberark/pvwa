---

- name: Get roles directory dirname
  ansible.builtin.set_fact:
    dotnet_installer_path: "C:\\ndp48-x86-x64-allos-enu.exe"

- name: Download .NET Framework 4.8
  ansible.windows.win_get_url:
    url: >
      https://download.visualstudio.microsoft.com/download/pr/014120d7-d689-4305-befd-3cb711108212/0fd66638cde16859462a6243a4629a50/ndp48-x86-x64-allos-enu.exe
    dest: "{{ dotnet_installer_path }}"

- name: Install Microsoft .NET Framework 4.8
  ansible.windows.win_package:
    path: "{{ dotnet_installer_path }}"
    product_id: '{50e73eb2-10f7-4457-954a-6b06fccc7d04}'
    arguments: /q /norestart
  register: dotnet_install

- name: Delete .NET Framework Installer
  ansible.windows.win_file:
    path: "{{ dotnet_installer_path }}"
    state: absent

- name: Reboot host if required
  ansible.windows.win_reboot:
  when: dotnet_install.reboot_required

- name: Check for missing PVWA prerequisite Windows features
  ansible.windows.win_shell: |
    $required = @(
    {% for feature in pvwa_required_windows_features %}
      '{{ feature }}'{% if not loop.last %},{% endif %}
    {% endfor %}
    )
    @($required | Where-Object { (Get-WindowsFeature -Name $_).InstallState -ne 'Installed' }) -join ','
  register: pvwa_missing_windows_features
  changed_when: false

- name: Install required Windows features for PVWA prerequisites
  ansible.windows.win_feature:
    name: "{{ pvwa_missing_windows_features.stdout | trim | split(',') | map('trim') | reject('equalto', '') | list }}"
    state: present
    include_sub_features: false
    include_management_tools: false
  when: pvwa_missing_windows_features.stdout | trim | length > 0
  register: pvwa_windows_features_install
  async: 3600
  poll: 15

- name: Reboot host if required after Windows feature install
  ansible.windows.win_reboot:
  when:
    - pvwa_windows_features_install is changed
    - pvwa_windows_features_install.reboot_required | default(false)

# tasks file for pvwa prerequisities

- name: Pre-Installation Block
  block:

    - name: Run PVWA prerequisities script
      ansible.windows.win_shell: |
        # Script Name: PVWAPreInstall.ps1
        # Description: Initiating pre-installation proccess of PVWA. If success, returns OK

        $ErrorActionPreference = "SilentlyContinue"

        try {
            Set-Location "{{ pvwa_installationautomation_folder }}"
            $Action = .\PVWA_Prerequisites.ps1
            $Action | Out-File -FilePath "{{ pvwa_prerequisites_log }}"
            $Result = Get-Content "{{ pvwa_prerequisites_log }}" -Raw | ConvertFrom-Json
            if ($Result.isSucceeded -ne 0) {
                exit 1
            } else {
                exit 0
            }
            exit 0
        } catch {
            Write-Output "Error occured: $error"
            exit 1
        }
      async: 900
      poll: 15

    - name: Get log path for prerequisites
      ansible.windows.win_shell: |
        $Result = Get-Content "{{ pvwa_prerequisites_log }}"
        Write-Output $Result
      register: log_result

    - name: Resolve prerequisites detail log path on remote host
      ansible.windows.win_shell: |
        $json = Get-Content "{{ pvwa_prerequisites_log }}" -Raw | ConvertFrom-Json
        $logPath = $json.logPath
        if ($logPath -match '^\.\\') {
            $logPath = Join-Path "{{ pvwa_installationautomation_folder }}" ($logPath -replace '^\.\\', '')
        }
        Write-Output $logPath
      register: pvwa_prereq_detail_log
      changed_when: false

    - name: Fetch prerequisites log from path
      ansible.builtin.fetch:
        src: '{{ pvwa_prereq_detail_log.stdout | trim }}'
        dest: '{{ log_path_dest }}/pvwa_prerequisites.log'
        flat: true
      when: pvwa_prereq_detail_log.stdout | trim | length > 0

  rescue:

    - name: Get log path for prerequisites
      ansible.windows.win_shell: |
        $Result = Get-Content "{{ pvwa_prerequisites_log }}"
        Write-Output $Result
      register: log_result

    - name: Resolve prerequisites detail log path on remote host
      ansible.windows.win_shell: |
        $json = Get-Content "{{ pvwa_prerequisites_log }}" -Raw | ConvertFrom-Json
        $logPath = $json.logPath
        if ($logPath -match '^\.\\') {
            $logPath = Join-Path "{{ pvwa_installationautomation_folder }}" ($logPath -replace '^\.\\', '')
        }
        Write-Output $logPath
      register: pvwa_prereq_detail_log
      changed_when: false
      failed_when: false

    - name: Fetch prerequisites log from path
      ansible.builtin.fetch:
        src: '{{ pvwa_prereq_detail_log.stdout | trim }}'
        dest: '{{ log_path_dest }}/pvwa_prerequisites.log'
        flat: true
      when: pvwa_prereq_detail_log.stdout | trim | length > 0
      failed_when: false

    - name: Fail when prerequisites not successful
      ansible.builtin.fail:
        msg: >-
          ERROR: Prerequisites failed.
          {{ (log_result.stdout | from_json).errorData | default('see CyberArk Script.log on the target host') }}.
          Result log: {{ pvwa_prerequisites_log }}