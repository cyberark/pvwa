---
# tasks file for pvwa registration

- name: Registration Block
  block:

    - name: Set registration vars as facts
      ansible.builtin.set_fact:
        pvwa_registration_configure_instance: true
        pvwa_registration_configure_vault: true
        pvwa_registration_register_instance: true
      when: pvwa_registration

    - name: Assign PVWA IP
      ansible.builtin.set_fact:
        pvwa_url: "https://{{ ansible_host }}/PasswordVault"
      when: pvwa_url is not defined

    - name: Stop report service
      ansible.windows.win_service:
        name: "CyberArk Scheduled Tasks"
        state: stopped
      when:
        - pvwa_registration_configure_instance

    - name: Create configure instance input json
      ansible.windows.win_copy:
        content: "{{ lookup('template', 'templates/ConfigureInstanceInput.json.j2') | to_nice_json }}"
        dest: '{{ pvwa_installation_path }}\Env\ConfigureInstanceInput.json'
      when:
        - pvwa_registration_configure_instance

    - name: Configure instance
      ansible.windows.win_shell: |
        .\PVWADeploy.ps1 -Action ConfigureInstance `
        -ParametersFile "{{ pvwa_installation_path }}\Env\ConfigureInstanceInput.json" `
        -configFilesPath "{{ pvwa_installation_path }}"
      args:
        chdir: "{{ pvwa_registrationtool_folder }}"
      when:
        - pvwa_registration_configure_instance
      register: pvwa_deploy_output

    - name: Fail when ConfigureInstance not successful
      ansible.builtin.fail:
        msg: >
          "failed to run PVWADeploy.ps1 ConfigureInstance. Please refer to {{ pvwa_installation_path }}\\Env\\Log\\ConfigureInstance.log for more information."
      when:
        - (pvwa_deploy_output.stdout is defined) and (pvwa_deploy_output.stdout.find('Failed to run') != -1)
        - pvwa_registration_configure_instance

    - name: Create configure vault input json
      ansible.windows.win_copy:
        content: "{{ lookup('template', 'templates/ConfigureVaultInput.json.j2') | to_nice_json }}"
        dest: '{{ pvwa_installation_path }}\Env\ConfigureVaultInput.json'
      when:
        - pvwa_registration_configure_vault

    - name: Configure vault
      ansible.windows.win_shell: |
        $secure_vault_password_object = ConvertTo-SecureString '{{ vault_password }}' -AsPlainText -Force
        .\PVWADeploy.ps1 -Action ConfigureVault `
        -ParametersFile "{{ pvwa_installation_path }}\Env\ConfigureVaultInput.json" `
        -configFilesPath "{{ pvwa_installation_path }}" `
        -VaultSecurePassword $secure_vault_password_object
      args:
        chdir: "{{ pvwa_registrationtool_folder }}"
      when:
        - pvwa_registration_configure_vault
      register: pvwa_deploy_output
      no_log: true

    - name: Fail when ConfigureVault not successful
      ansible.builtin.fail:
        msg: >
          "failed to run PVWADeploy.ps1 ConfigureVault. Please refer to {{ pvwa_installation_path }}\\Env\\Log\\ConfigureVault.log for more information."
      when:
        - (pvwa_deploy_output.stdout is defined) and (pvwa_deploy_output.stdout.find('Failed to run') != -1)
        - pvwa_registration_configure_vault

    - name: Create register instance input json
      ansible.windows.win_copy:
        content: "{{ lookup('template', 'templates/RegisterInstanceInput.json.j2') | to_nice_json }}"
        dest: '{{ pvwa_installation_path }}\Env\RegisterInstanceInput.json'
      when:
        - pvwa_registration_register_instance

    - name: Register instance
      ansible.windows.win_shell: |
        $secure_vault_password_object = ConvertTo-SecureString '{{ vault_password }}' -AsPlainText -Force
        .\PVWADeploy.ps1 -Action RegisterInstance `
        -ParametersFile "{{ pvwa_installation_path }}\Env\RegisterInstanceInput.json" `
        -configFilesPath "{{ pvwa_installation_path }}" `
        -VaultSecurePassword $secure_vault_password_object
      args:
        chdir: "{{ pvwa_registrationtool_folder }}"
      when:
        - pvwa_registration_register_instance
      register: pvwa_deploy_output
      no_log: true

    - name: IIS Restart
      ansible.windows.win_shell: |
        iisreset /stop
        iisreset /start
      when:
        - pvwa_registration_register_instance

    - name: Fail when RegisterInstance not successful
      ansible.builtin.fail:
        msg: >
          "failed to run PVWADeploy.ps1 RegisterInstance. Please refer to {{ pvwa_installation_path }}\\Env\\Log\\RegisterInstance.log for more information."
      when:
        - (pvwa_deploy_output.stdout is defined) and (pvwa_deploy_output.stdout.find('Failed to run') != -1)
        - pvwa_registration_register_instance

    - name: Check that you can connect (GET) to pvwa and it returns a status 200
      ansible.windows.win_uri:
        url: "https://127.0.0.1/PasswordVault/api/server"
        validate_certs: false
        timeout: 60
      register: pvwa_server_info
      until: pvwa_server_info.status_code == 200
      retries: 12
      delay: 10
      when:
        - pvwa_registration_register_instance

    - name: Start report service
      ansible.windows.win_service:
        name: "CyberArk Scheduled Tasks"
        state: started
      when:
        - pvwa_registration_register_instance

    - name: Set registration status as fact
      ansible.builtin.set_fact:
        pvwa_registered: true
      when:
        - pvwa_registration_register_instance

  rescue:

    - name: Fail when registration not successful
      ansible.builtin.fail:
        msg: 'ERROR: Registration failed.'
  when: not use_pvwa_register_script

# To use this you have to run all the steps (including pvwa_clean) without registration and then run only registration with the use_pvwa_register_script param
- name: Registration Block - Modern
  block:
    - name: Register instance
      ansible.windows.win_shell: |
        $SecuredAdminPassword = ConvertTo-SecureString -AsPlainText '{{ vault_password }}' -Force
        .\\PVWAComponentRegistration.ps1 -VaultIpAddress {{ vault_ip }} `
        -VaultAdminUser {{ vault_username }} `
        -VaultPort {{ vault_port }} `
        -HostName '{{ ansible_host }}' `
        -AdminPassword $SecuredAdminPassword
      args:
        chdir: C:\CyberArk\Deployment\
      when:
        - use_pvwa_register_script
        - platform == 'aws'
