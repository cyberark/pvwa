---
# tasks file for pvwa

- name: Validate input parameters
  ansible.builtin.include_tasks: pvwa_validateparameters.yml

- name: Check if Amazon CloudWatch Agent is already installed
  ansible.windows.win_stat:
    path: "C:\\Program Files\\Amazon\\AmazonCloudWatchAgent\\amazon-cloudwatch-agent-ctl.ps1"
  register: cwa_stat
  when: platform == 'aws'

- name: Download Amazon CloudWatch Agent installer
  ansible.windows.win_get_url:
    url: https://s3.amazonaws.com/amazoncloudwatch-agent/windows/amd64/latest/amazon-cloudwatch-agent.msi
    dest: C:\Windows\Temp\amazon-cloudwatch-agent.msi
  when:
    - platform == 'aws'
    - not cwa_stat.stat.exists

- name: Install Amazon CloudWatch Agent
  ansible.windows.win_package:
    path: C:\Windows\Temp\amazon-cloudwatch-agent.msi
    state: present
    arguments: /quiet
  when:
    - platform == 'aws'
    - not cwa_stat.stat.exists

- name: Remove Amazon CloudWatch Agent installer
  ansible.windows.win_file:
    path: C:\Windows\Temp\amazon-cloudwatch-agent.msi
    state: absent
  when:
    - platform == 'aws'
    - not cwa_stat.stat.exists

- name: Ensure AmazonCloudWatchAgent service starts automatically
  ansible.windows.win_service:
    name: AmazonCloudWatchAgent
    start_mode: auto
  when: platform == 'aws'

- name: Extract PVWA package
  ansible.builtin.include_tasks: pvwa_extract.yml
  when:
    - pvwa_extract

- name: Running PVWA prerequisities
  ansible.builtin.include_tasks: pvwa_prerequisites.yml
  when:
    - pvwa_prerequisites

- name: Running PVWA install
  ansible.builtin.include_tasks: pvwa_install.yml
  when:
    - pvwa_install
    - not pvwa_exists

- name: Running PVWA hardening
  ansible.builtin.include_tasks: pvwa_hardening.yml
  when:
    - pvwa_hardening
    - pvwa_exists
    - not pvwa_hardened

- name: Running PVWA registration
  ansible.builtin.include_tasks: pvwa_registration.yml
  when:
    - pvwa_registration or pvwa_registration_configure_instance or pvwa_registration_configure_vault or pvwa_registration_register_instance
    - pvwa_exists
    - not pvwa_registered

- name: Running PVWA clean
  ansible.builtin.include_tasks: pvwa_clean.yml
  when:
    - pvwa_clean
